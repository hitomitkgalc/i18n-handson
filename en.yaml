methodology.tab.ai_workflow.pattern.1.title: CAT + MT + AIR + PE — Balanced
methodology.tab.ai_workflow.pattern.1.tag: Balanced
methodology.tab.ai_workflow.pattern.1.desc: "High-TM-match segments handled by CAT; the rest flows to MT+AI Review. Maximizes TM assets while balancing cost, quality, and speed."
methodology.tab.ai_workflow.pattern.1.case.1: Strong translation memory (TM) exists
methodology.tab.ai_workflow.pattern.1.case.2: Ongoing or repetitive content
methodology.tab.ai_workflow.pattern.1.case.3: "Need balance of cost, quality, and speed"
methodology.tab.ai_workflow.pattern.2.title: MT + AIR + PE — Speed-First
methodology.tab.ai_workflow.pattern.2.tag: Speed
methodology.tab.ai_workflow.pattern.2.desc: "Faster without TM. MT+LC pre-scans for errors; humans focus only on flagged segments, minimizing PE effort."
methodology.tab.ai_workflow.pattern.2.case.1: Low TM / new project
methodology.tab.ai_workflow.pattern.2.case.2: Tight deadlines or high volume
methodology.tab.ai_workflow.pattern.2.case.3: "Marketing content, blog articles"
methodology.tab.ai_workflow.pattern.3.title: MT + PE + AIR — Safety Net
methodology.tab.ai_workflow.pattern.3.tag: Quality Assurance
methodology.tab.ai_workflow.pattern.3.desc: LC acts as a final safety net after human PE, catching fatigue-related errors that humans miss.
methodology.tab.ai_workflow.pattern.3.case.1: Human-led but want AI final check
methodology.tab.ai_workflow.pattern.3.case.2: Long or repetitive projects prone to fatigue
methodology.tab.ai_workflow.pattern.3.case.3: "UI strings, product documentation"
methodology.tab.ai_workflow.pattern.4.title: T + AIR — Quality-First
methodology.tab.ai_workflow.pattern.4.tag: Highest Quality
methodology.tab.ai_workflow.pattern.4.desc: "Human translation as the base, with LC confirming consistency, terminology, and locale rules. For content where MT influence is unacceptable."
methodology.tab.ai_workflow.pattern.4.case.1: "Medical, legal, or financial content requiring high accuracy"
methodology.tab.ai_workflow.pattern.4.case.2: Brand-voice-critical content
methodology.tab.ai_workflow.pattern.4.case.3: Language pairs where MT quality is unreliable

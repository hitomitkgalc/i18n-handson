methodology.tab.mqm_dqf.example.title: "Example: Fuzzy Match Bug — RCA Process"
methodology.tab.mqm_dqf.example.identify: '"surveys" mistranslated repeatedly → recurring error = structural issue'
methodology.tab.mqm_dqf.example.investigate: 'TB has "survey = questionnaire" but Fuzzy match is OFF — plural forms not matching → Tools issue'
methodology.tab.mqm_dqf.example.fix: "Enabled Fuzzy match; configured TB to catch survey / surveys / surveying"
methodology.tab.mqm_dqf.example.monitor: Track next project to confirm the error does not recur

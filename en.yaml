cases.hubspot.title: "SignUp CVR uplift: +51% via localization-driven A/B test"
cases.hubspot.detail: "Analyzed Japan signup CVR gap— JA 16% vs EN 25% — from a localization lens. Proposed optional-field callouts and pre-form overlay. North Star metric improved 51% (statistically significant). Also flagged downstream lead qualification risk — a structural trade-off only visible through combined localization + sales expertise."
cases.amazon.company: Amazon Japan
cases.amazon.period: Feb 2021 – May 2023
cases.amazon.tag: Localization × ML Training Data
cases.amazon.title: "150% faster, 5% more revenue: Amazon Japan ML model localization"
cases.amazon.detail: "ATRIA project: localized AI catalog classification for Japan. Audited English substitutability logic across all categories. Fed Japan-specific standards to EU data scientists. Achieved 15% error rate vs 30–40% in EU. Awarded Most Valuable Contribution Q3 2022."

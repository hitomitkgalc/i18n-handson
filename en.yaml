expertise.card.saas.title: SaaS UI/UX Localization
expertise.card.saas.body: UI string translation, terminology management, in-app QA testing. Product-quality Japanese localization that accounts for character limits, context, and user flows.
expertise.card.transcreation.title: Marketing Transcreation
expertise.card.transcreation.body: Adapting brand voice and marketing copy for Japanese audiences — with cultural depth and search visibility in mind. From tagline transcreation to SEO/AEO-optimized meta content, grounded in Japanese search behavior and user psychology.
expertise.card.lqa.title: AI-Powered Localization Workflow
expertise.card.lqa.body: Building scalable localization workflows powered by LLM prompts and QA automation. From Style Guide-trained MT output to structured error categorization — reducing post-edit effort without sacrificing nuance.

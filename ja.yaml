methodology.tab.ai_workflow.pattern.1.title: CAT + MT + AIR + PE — バランス型
methodology.tab.ai_workflow.pattern.1.tag: バランス重視
methodology.tab.ai_workflow.pattern.1.desc: "TMのマッチ率が高いセグメントはCATで処理し、残りを機械翻訳+AIレビューに流す。TM資産を最大活用しながらコスト・品質・スピードをバランスよく確保。"
methodology.tab.ai_workflow.pattern.1.case.1: 翻訳メモリ（TM）が充実している
methodology.tab.ai_workflow.pattern.1.case.2: 継続的なプロジェクト・反復コンテンツ
methodology.tab.ai_workflow.pattern.1.case.3: "コスト・品質・スピードをバランスよく求める"
methodology.tab.ai_workflow.pattern.2.title: MT + AIR + PE — 速度優先型
methodology.tab.ai_workflow.pattern.2.tag: スピード重視
methodology.tab.ai_workflow.pattern.2.desc: "TM省略により高速化。機械翻訳+AIレビューでエラーを事前スキャンし、人間はフラグ箇所のみ集中。人手による校正の工数を最小化する。"
methodology.tab.ai_workflow.pattern.2.case.1: TMが少ない・新規プロジェクト
methodology.tab.ai_workflow.pattern.2.case.2: 短納期・大量コンテンツ
methodology.tab.ai_workflow.pattern.2.case.3: "マーケティングコンテンツ、ブログ記事"
methodology.tab.ai_workflow.pattern.3.title: MT + PE + AIR — セーフティネット
methodology.tab.ai_workflow.pattern.3.tag: 品質保証
methodology.tab.ai_workflow.pattern.3.desc: 機械翻訳→人による校正の後にAIが「最終の目」として機能。疲労・見落としによるエラーをAIが検知し、品質を担保する。
methodology.tab.ai_workflow.pattern.3.case.1: 人間が主だが最終確認をAIに任せたい
methodology.tab.ai_workflow.pattern.3.case.2: 長文・反復作業で疲労が蓄積しやすい案件
methodology.tab.ai_workflow.pattern.3.case.3: "UI文字列・\n製品ドキュメント"
methodology.tab.ai_workflow.pattern.4.title: T + AIR — 品質最重視型
methodology.tab.ai_workflow.pattern.4.tag: 最高品質
methodology.tab.ai_workflow.pattern.4.desc: "機械翻訳を使わず人による一次翻訳を基本とし、LCが一貫性・用語・形式エラーを最終確認。機械翻訳ミスの影響を避けたいコンテンツに。"
methodology.tab.ai_workflow.pattern.4.case.1: "医療・法律・金融など高精度な翻訳が必要"
methodology.tab.ai_workflow.pattern.4.case.2: ブランドボイスが重要なコンテンツ
methodology.tab.ai_workflow.pattern.4.case.3: 機械翻訳の品質が信頼できない言語ペア

hero.body: HubSpot Japanで営業・CSの経験を持つUIローカリゼーションスペシャリストとして、文化と市場の知見をビジネス成果に変換。—CVR+51%・収益5%成長など実績を積み上げながら、言語×UX×ビジネスを統合し、日本市場への橋をかけます。

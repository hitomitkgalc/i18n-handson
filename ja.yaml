  ３つの専門領域
expertise.card.saas.title: SaaS UI/UXローカリゼーション
expertise.card.saas.body: UI文字列翻訳、用語管理、アプリ内QAテストまで。文字数・コンテキスト・ユーザーフローを考慮した、製品品質に直結する日本語ローカリゼーション。
expertise.card.transcreation.title: マーケティング翻訳・トランスクリエーション
expertise.card.transcreation.body: 日本語ユーザーに響くブランドボイスとマーケティングコピーを、文化的深度と検索の可視性も意識して適応。タグラインのトランスクリエーションからSEO/AEO最適化したメタコンテンツまで、日本人の検索行動とユーザー心理に根ざした翻訳を提供。
expertise.card.lqa.title: AIを活用したローカリゼーションワークフロー
expertise.card.lqa.body: LLMプロンプトとQA自動化を活用した、効率的なローカリゼーションワークフローを構築。スタイルガイドで学習させた機械翻訳アウトプットから構造化されたエラー分類まで―ニュアンスを損なうことなく、人手による修正負荷を軽減。

cases.hubspot.company: HubSpot Japan
cases.hubspot.period: Aug 2024 – Present
cases.hubspot.tag: Localization × UX Researchローカリゼーション
cases.hubspot.title: "SignUp CVR +51%改善：ローカリゼーション主導のA/Bテスト"
cases.hubspot.detail: "日本語ユーザーのサインアップCVR（16%）が英語（25%）を大幅に下回る問題をローカリゼーション観点から分析。電話番号・URL入力の「任意」表示改善と、入力目的を説明するオーバーレイ等を提案。North Star指標（Free→Starter有料プラン転換）が51%改善（有意）。さらに「任意化による営業データ欠損リスク」の副作用の可能性も指摘し、ローカリゼーションと営業・CSの両知見を持つからこそ見えた構造的トレードオフとして、コンテンツデザインチームに提言。"
cases.amazon.company: Amazon Japan
cases.amazon.period: Feb 2021 – May 2023
cases.amazon.tag: Localization × ML Training Data
cases.amazon.title: "150%納品速度改善・5%売上増：Amazon Japan カタログ機械学習モデルのローカリゼーション"
cases.amazon.detail: "ATRIAプロジェクト：AIカタログ分類機械学習モデルを日本市場向けにローカライズ。英語圏の「代替性ベース分類」が日本食文化や生活文化に適用できない事例を全カテゴリで検証。EUデータサイエンティストに日本固有の分類基準をフィードバックし、機械学習のデータ分類品質を向上。EU市場30〜40%のエラー率を大幅に下回る15%までの削減を達成。Q3 2022 Amazon ADS Most Valuable Contribution受賞。"
